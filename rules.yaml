# 學分門檻規則：數字判斷一律交給 core/rules.py 計算，不讓 LLM 自己比大小。
#
# 欄位：
#   rule_id      規則代號（不可重複）
#   category     分類，list_credit_rules 依此分組顯示
#   description  門檻內容，並寫明「適用對象」與「不適用的例外」，讓 LLM 選對規則
#   input        呼叫 check_credit_rule 時 value 要填什麼（每學期？累計？分數？）
#   operator     >=、<=、>、<、==（學生的數字 <operator> threshold 才算通過）
#   threshold    門檻數字，必須能在 source 所指的條文中找到
#   derivation   （選填）門檻是條文數字相加而來時寫算式，例如 "22 + 4"；每個數字都要在條文中找得到
#   unit         單位（學分、分、學期、門）
#   source       出處：「辦法名稱 條號」，要和 kb/chunks.json 的 id 對得上
#   verified     核對 PDF 原文（數字、比較方向、適用對象）後才能設 true，核對紀錄見 docs/規則核對表.md；
#                false 時回答會附「此規則尚未經人工確認」。新增或修改規則時一律先設 false
#
# 一條規則只管一個門檻、一種對象。條文沒寫清楚的組合（例如法律系又是輔系生）不要自己推算，
# 讓 LLM 走 route_case。

# ---------- 每學期修課學分（學士班一般學生） ----------
- rule_id: semester_min_credits_y1_3
  category: 每學期修課學分（學士班）
  description: 學士班（日間學制大學部、進修學士班）一至三年級每學期最低修習學分（一般學生；加退選截止一週內仍低於規定者應令休學，此項自 115 學年度施行，見選課辦法第十四條；停修後剩餘學分也不得低於此數，見選課辦法第七條）
  input: 本學期所選（或停修後剩餘）的學分總數
  operator: ">="
  threshold: 16
  unit: 學分
  source: 選課辦法 第三條
  verified: true

- rule_id: semester_min_credits_y4
  category: 每學期修課學分（學士班）
  description: 學士班（日間學制大學部、進修學士班）四年級每學期最低修習學分（一般學生；加退選截止一週內仍低於規定者應令休學，此項自 115 學年度施行，見選課辦法第十四條；停修後剩餘學分也不得低於此數，見選課辦法第七條）
  input: 本學期所選（或停修後剩餘）的學分總數
  operator: ">="
  threshold: 8
  unit: 學分
  source: 選課辦法 第三條
  verified: true

- rule_id: semester_max_credits
  category: 每學期修課學分（學士班）
  description: 學士班每學期修課學分上限（一般學生，不是法律系、輔系生、雙主修或前學期平均 80 分以上者；這些身分請改用 semester_max_credits_law／_minor／_double_major_or_honors）
  input: 本學期所選的學分總數
  operator: "<="
  threshold: 22
  unit: 學分
  source: 選課辦法 第三條
  verified: true

- rule_id: semester_max_credits_law
  category: 每學期修課學分（學士班）
  description: 法律系學生每學期修課學分上限（法律系又是輔系生／雙主修／成績優異者，條文未寫明是否可再加修，請改走 route_case）
  input: 本學期所選的學分總數
  operator: "<="
  threshold: 25
  unit: 學分
  source: 選課辦法 第三條
  verified: true

- rule_id: semester_max_credits_minor
  category: 每學期修課學分（學士班）
  description: 輔系生每學期修課學分上限（一般上限 22 學分＋額外加修 4 學分；不適用法律系）
  input: 本學期所選的學分總數（含輔系課程）
  operator: "<="
  threshold: 26
  derivation: "22 + 4"
  unit: 學分
  source: 選課辦法 第三條
  verified: true

- rule_id: semester_max_credits_double_major_or_honors
  category: 每學期修課學分（學士班）
  description: 雙主修學生、或前學期學業成績總平均 80 分以上學生的每學期修課學分上限（條文「雙主修與前學期學業成績總平均八十分以上之學生」解讀為兩種學生各自適用；一般上限 22 學分＋額外加修 6 學分；不適用法律系；是否符合成績條件請先用 honors_extra_credits_gpa_min 判斷）
  input: 本學期所選的學分總數
  operator: "<="
  threshold: 28
  derivation: "22 + 6"
  unit: 學分
  source: 選課辦法 第三條
  verified: true

- rule_id: honors_extra_credits_gpa_min
  category: 每學期修課學分（學士班）
  description: 可額外加修 6 學分的成績條件：前學期學業成績總平均 80 分以上
  input: 前學期學業成績總平均（分數）
  operator: ">="
  threshold: 80
  unit: 分
  source: 選課辦法 第三條
  verified: true

- rule_id: y4_graduate_courses_max
  category: 每學期修課學分（學士班）
  description: 學士班及進修學士班四年級學生，經授課教師及開課系所主管核可後，可修習的碩士班課程數上限（在職專班課程除外）
  input: 想修的碩士班課程門數（條文只寫「得修習碩士班二門課程」，未寫明是每學期或在學期間累計，回答時要說明這點）
  operator: "<="
  threshold: 2
  unit: 門
  source: 選課辦法 第八條
  verified: true

