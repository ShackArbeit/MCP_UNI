# 案件分流：類別 → 承辦單位與業務窗口。
#
# 資料來源：世新大學「業務聯絡窗口」 https://oaa.web.shu.edu.tw/wd-shu
#           世新大學「聯絡方式」     https://www.shu.edu.tw/SHU-Contact.aspx
# 擷取日期：2026-10-20。人員與分機可能異動，demo 前請再核對一次。
#
# 結構：
#   categories.<類別>.unit / scope / contact：類別層級的預設承辦單位（沒有對到窗口時使用）
#   categories.<類別>.windows：業務窗口清單。route_case 依序比對 keywords，摘要含任一關鍵字
#     就分到該窗口；排在前面的優先（例如「冷氣卡」要排在「冷氣」前面）。
#   route_case 收到不在清單中的類別時，一律歸到「綜合服務」。
#
# 「專案服役」歸教務：專案服役彈性修業辦法第三點寫明向教務處註冊課務組提出申請
# （業務聯絡窗口頁面沒有列這一項）。「兵役」（緩徵、役期折抵）則是學務處生輔組。

